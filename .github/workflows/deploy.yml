name: Build and Publish

# 认证：使用仓库内 .github/deploy_key（WSL 私钥 id_rsa 副本，权限 600）。
# ⚠️ 该私钥为账号级凭据：本仓库必须保持私有，任何能读到它的人可写你全部仓库。
# 无需任何 secrets / PAT / deploy key 配置。
on:
  schedule:
    - cron: "0 2 * * *" # 每日 UTC 2:00（北京时间 10:00）全量重建
  push:
    branches: [main] # 引擎或流水线变更后自动重建（也用于云端验证）
  workflow_dispatch: {}
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Setup SSH key from committed file
        run: |
          mkdir -p ~/.ssh
          cp .github/deploy_key ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"

      - name: Clone content repo (private, via SSH)
        run: git clone --depth 1 git@github.com:zeek-zhao/ai-obsidian.git content

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish to Pages repo (orphan push)
        run: |
          cd public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "publish from ob-content (cloud-actions ${GITHUB_SHA::7})"
          git push -f git@github.com:zeek-zhao/zeek-zhao.github.io.git gh-pages:gh-pages
