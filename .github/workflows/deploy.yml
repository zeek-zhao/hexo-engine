name: Build and Publish

# 认证：全部走 HTTPS + PAT secret，仓库内不保存任何 SSH 私钥。
# DEPLOY_TOKEN：读 zeek-zhao/ai-obsidian（私有内容库）+ 写 zeek-zhao/zeek-zhao.github.io。
# 提交身份统一 zeek.zhao <zeek.zhao@foxmail.com>（见 05-发布流与AI使用规范.md）。
#
# ⚠ 时差坑（必须遵守）：Clone content repo 拉的是 ai-obsidian main。
#   先推内容源 → 再触发本构建 → 核对 Clone 步骤日志里的 commit == 内容源 HEAD。
#
# ── 分阶段架构（2026-11 重构，解决单 job 12 步黑盒、卡住难排查）──
#   preflight  源码门禁 + 收集（clone/install/check:meta/collect/audit:cat）——秒级，早失败
#   build      渲染 + 私密加密（hexo generate）——耗时瓶颈，独立 job 便于观察
#   verify     渲染体检 + BDD（并发矩阵，读 build 产物）——互不依赖，并行提速
#   publish    发布到 Pages（needs 全部上游绿）
# 每阶段失败只影响自身，GitHub UI 直接定位；public 产物用 artifact 传递。
on:
  schedule:
    - cron: "0 2 * * *" # 每日 UTC 2:00（北京 10:00）全量重建
  push:
    branches: [main]
  workflow_dispatch: {}
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read

concurrency:
  group: pages-publish
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────
  # 阶段 1：预检（快速失败）——源码门禁 + 收集，秒级
  # 元数据/格式问题在昂贵的 hexo generate 之前暴露，不用等 1 小时
  # ─────────────────────────────────────────────────────────
  preflight:
    name: "1 · 预检（源码门禁）"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Clone content repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${DEPLOY_TOKEN}@github.com/zeek-zhao/ai-obsidian.git content
          echo "CONTENT_HEAD=$(git -C content rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check content metadata gate
        # CFG-04/FMT-01/FMT-02/PIP-01/PIP-02：collect 前拦截元数据/短链/格式问题
        run: node bin/check-metadata.js

      - name: Collect content
        # 生成 source/_posts、search.json、tags/categories 统计页
        run: npm run collect

      - name: Audit category counts
        # CAT-06：分类计数与归属对账（只读告警，需 collect 后的统计页）
        run: npm run audit:cat

      - name: Summary
        run: echo "✅ 预检通过 · content HEAD=${{ env.CONTENT_HEAD }}"

  # ─────────────────────────────────────────────────────────
  # 阶段 2：渲染（耗时瓶颈，独立 job）——便于单独观察/限时/排查
  # ─────────────────────────────────────────────────────────
  build:
    name: "2 · 渲染（hexo generate + 私密加密）"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Clone content repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: git clone --depth 1 https://x-access-token:${DEPLOY_TOKEN}@github.com/zeek-zhao/ai-obsidian.git content

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Collect content
        run: npm run collect

      - name: Hexo generate
        # 单独成步：过去 check-pages 被塞进 build 脚本，跑 1 小时后才发现是体检失败
        run: npx hexo clean && npx hexo generate

      - name: Encrypt private posts
        # 任务A：口令仅从 Secret 注入，绝不写库；0 篇私密时无行为变化
        env:
          CONTENT_PASSWORD: ${{ secrets.CONTENT_PASSWORD }}
        run: node bin/encrypt-private.js

      - name: Upload rendered site
        # 传给 verify 并发检查与 publish 发布；仅产物目录
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: public/
          retention-days: 1
          include-hidden-files: true

  # ─────────────────────────────────────────────────────────
  # 阶段 3：验证（并发矩阵）——两项检查互不依赖，并行跑，省时间
  # 任一项 FAIL → publish 不执行
  # ─────────────────────────────────────────────────────────
  verify:
    name: "3 · 验证 · ${{ matrix.check }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        check: [rendered-pages, bdd]
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download rendered site
        uses: actions/download-artifact@v4
        with:
          name: rendered-site
          path: public/

      - name: Check rendered pages
        if: matrix.check == 'rendered-pages'
        # 全站渲染体检（按语法类型断言）；失败则不发布
        run: node scripts/check-pages.js

      - name: BDD functional tests
        if: matrix.check == 'bdd'
        # Given/When/Then 场景断言（tests/features/）；失败则不发布
        run: node tests/bdd-runner.js

  # ─────────────────────────────────────────────────────────
  # 阶段 4：发布——needs 全部上游绿，下载同一份已验证产物
  # ─────────────────────────────────────────────────────────
  publish:
    name: "4 · 发布到 Pages"
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download rendered site
        uses: actions/download-artifact@v4
        with:
          name: rendered-site
          path: public/

      - name: Publish to Pages repo (orphan push)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          cd public
          git init -q -b gh-pages
          git config user.name "zeek.zhao"
          git config user.email "zeek.zhao@foxmail.com"
          git remote add origin https://x-access-token:${DEPLOY_TOKEN}@github.com/zeek-zhao/zeek-zhao.github.io.git
          git add -A
          git commit -q -m "publish from ob-content (cloud-actions ${GITHUB_SHA::7})"
          git push -f origin gh-pages:gh-pages
