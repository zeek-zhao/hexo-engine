name: Build and Publish

# 认证：全部走 HTTPS + PAT secret，仓库内不再保存任何 SSH 私钥。
# DEPLOY_TOKEN 需要具备：读 zeek-zhao/ai-obsidian（私有内容库）+
#                        写 zeek-zhao/zeek-zhao.github.io（公开产物仓）。
# 提交身份统一为 zeek.zhao <zeek.zhao@foxmail.com>，
# 依据见 ai-obsidian/90-OB工程管理/方案/05-发布流与AI使用规范.md「提交身份基线」。
#
# ⚠ 执行顺序（先内容源后引擎，强制）：本工作流构建时 clone 的是 ai-obsidian 的 main，
#   必须保证内容源已推送就位再触发本构建，否则 clone 到旧提交、线上不含本次改动。
#   1) 先推 ai-obsidian 内容源（文章/frontmatter/06-分类映射.json），记下 HEAD SHA；
#   2) 如需改引擎（主题/本文件），再推 hexo-engine；
#   3) 触发构建后，核对下方「Clone content repo」日志里的 ai-obsidian commit == 步骤1 SHA；
#      不等即clone到旧内容（时差坑），手动 workflow_dispatch 重跑一次。
#   详见 05 规范 §6.1「执行顺序：先内容源，后引擎」。
on:
  schedule:
    - cron: "0 2 * * *" # 每日 UTC 2:00（北京时间 10:00）全量重建
  push:
    branches: [main] # 引擎或流水线变更后自动重建（也用于云端验证）
  workflow_dispatch: {}
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Clone content repo (private, via HTTPS + DEPLOY_TOKEN)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${DEPLOY_TOKEN}@github.com/zeek-zhao/ai-obsidian.git content

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 2026-11 审计门禁（CFG-04/FMT-01/FMT-02/PIP-01/PIP-02）：collect 前拦截元数据/短链/格式问题
      - name: Check content metadata gate
        run: node bin/check-metadata.js

      - name: Build
        run: npm run build

      # 全站渲染体检（按语法类型断言，见 docs/SDD-01 §门禁）：失败则不发布
      - name: Check rendered pages
        run: node scripts/check-pages.js

      # BDD 功能性测试（Given/When/Then 场景断言，见 tests/features/）：失败则不发布
      - name: BDD functional tests
        run: npm run test:bdd

      - name: Publish to Pages repo (orphan push)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          cd public
          git init -q -b gh-pages
          git config user.name "zeek.zhao"
          git config user.email "zeek.zhao@foxmail.com"
          git remote add origin https://x-access-token:${DEPLOY_TOKEN}@github.com/zeek-zhao/zeek-zhao.github.io.git
          git add -A
          git commit -q -m "publish from ob-content (cloud-actions ${GITHUB_SHA::7})"
          git push -f origin gh-pages:gh-pages
