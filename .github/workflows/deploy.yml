name: Build and Publish

# 认证：全部走 HTTPS + PAT secret，仓库内不再保存任何 SSH 私钥。
# DEPLOY_TOKEN 需要具备：读 zeek-zhao/ai-obsidian（私有内容库）+
#                        写 zeek-zhao/zeek-zhao.github.io（公开产物仓）。
# 提交身份统一为 zeek.zhao <zeek.zhao@foxmail.com>，
# 依据见 ai-obsidian/90-OB工程管理/方案/05-发布流与AI使用规范.md「提交身份基线」。
on:
  schedule:
    - cron: "0 2 * * *" # 每日 UTC 2:00（北京时间 10:00）全量重建
  push:
    branches: [main] # 引擎或流水线变更后自动重建（也用于云端验证）
  workflow_dispatch: {}
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Clone content repo (private, via HTTPS + DEPLOY_TOKEN)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${DEPLOY_TOKEN}@github.com/zeek-zhao/ai-obsidian.git content

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish to Pages repo (orphan push)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          cd public
          git init -q -b gh-pages
          git config user.name "zeek.zhao"
          git config user.email "zeek.zhao@foxmail.com"
          git remote add origin https://x-access-token:${DEPLOY_TOKEN}@github.com/zeek-zhao/zeek-zhao.github.io.git
          git add -A
          git commit -q -m "publish from ob-content (cloud-actions ${GITHUB_SHA::7})"
          git push -f origin gh-pages:gh-pages
