title: Zeek 的 AI 知识工程
subtitle: 用 AI 跑一条内容流水线
description: AI 驱动的 Obsidian 知识工程博客
keywords: Obsidian, AI, Hexo, 知识管理
author: Zeek Zhao
language: zh-CN
timezone: 'Asia/Shanghai'
url: https://zeek-zhao.github.io
root: /
# abbrlink：每篇文章生成稳定短链（crc32 十进制），改标题/日期不影响 URL
permalink: posts/:abbrlink.html
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - index.html
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'date'
per_page: 10
pagination_dir: page
theme: zeek
server:
  port: 4000
  compress: true
  header: true
marked:
  gfm: true
# ── 插件 ──────────────────────────────────
# 短链
abbrlink:
  alg: crc32
  rep: dec
# 音乐播放器（hexo-tag-aplayer；页面内用 {% aplayer %} 标签插入）
aplayer:
  meting: false
  asset_inject: false
# 站内搜索数据源唯一为 bin/collect.js 生成的 source/search.json（原 search.xml 配置已随
# hexo-generator-search 移除，见 docs/SDD-01-概要设计.md §搜索）
