title: Zeek 的 AI 知识工程
subtitle: 用 AI 跑一条内容流水线
description: AI 驱动的 Obsidian 知识工程博客
keywords: Obsidian, AI, Hexo, 知识管理
author: Zeek Zhao
language: zh-CN
timezone: 'Asia/Shanghai'
url: https://zeek-zhao.github.io
root: /
# abbrlink：每篇文章生成稳定短链（crc32 十进制），改标题/日期不影响 URL
permalink: posts/:abbrlink.html
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - index.html
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'date'
per_page: 10
pagination_dir: page
theme: zeek
server:
  port: 4000
  compress: true
  header: true
marked:
  gfm: true
# ── 插件 ──────────────────────────────────
# 短链
abbrlink:
  alg: crc32
  rep: dec
# 音乐播放器（hexo-tag-aplayer；页面内用 {% aplayer %} 标签插入）
aplayer:
  meting: false
  asset_inject: false
# 站内搜索数据源唯一为 bin/collect.js 生成的 source/search.json（原 search.xml 配置已随
# hexo-generator-search 移除，见 docs/SDD-01-概要设计.md §搜索）

# ── 主题 zeek 装饰与渲染开关（themes/zeek/scripts + main.js 装饰增强层） ──
zeek:
  katex: true      # 数学公式 KaTeX（CDN 客户端渲染，正文含 $ 时才加载 JS）
  mermaid: true    # mermaid 图（CDN 客户端渲染，失败回退原代码块）
  mascot: true     # 右下角 live2d 形象（CDN 加载，失败静默；窄屏/减少动效自动关闭）
  bgm: "/bgm/playlist.json"  # 背景音乐：.json 结尾 = 电台节目单模式（source/bgm/playlist.json，构建期抓取网易云电台）；其他值 = 单音频文件 URL；空 = 不渲染播放按钮
  analytics: "goatcounter-zeek-zhao"  # 访问统计（第七轮配置槽）：ga4-G-XXXXXXXXXX 或 goatcounter-<站点代码>；空 = 不加载任何统计脚本（zeek-zhao 需在 goatcounter.com 注册同名站点后计数生效）
  # 评论 giscus（GitHub Discussions，仅文章页懒加载；id 为公开的 widget 参数非密钥）
  giscus:
    repo: zeek-zhao/zeek-zhao.github.io
    repoId: R_kgDOOQtDmA
    category: Announcements
    categoryId: DIC_kwDOOQtDmM4DLIB1
    lang: zh-CN

# ── RSS（atom.xml 摘要模式，2026-11-14 第六轮）──
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: false   # 摘要模式：description/摘要，不输出全文

# ── sitemap（SEO 收录）──
# CFG-02（任务 D）：只收正文页 + 首页；自定义模板过滤掉 tags/categories/pages/archive 等薄页。
sitemap:
  path: sitemap.xml
  tags: false
  categories: false
  template: themes/zeek/sitemap.xml